org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# --- Ajustes agregados para el Proyecto Integrador (Etapa 3) ---
# Sin estos timeouts, una conexion que se queda a medias deja la compilacion
# esperando indefinidamente en la descarga de dependencias.
systemProp.org.gradle.internal.http.connectionTimeout=60000
systemProp.org.gradle.internal.http.socketTimeout=60000

# Reintenta la descarga en lugar de abortar al primer fallo de red.
systemProp.org.gradle.internal.repository.max.retries=5
systemProp.org.gradle.internal.repository.initial.backoff=500

# Compilacion en paralelo y cache habilitada.
org.gradle.parallel=true
org.gradle.caching=true
